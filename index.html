<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>2048 — PWA</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23edc22e%22/><text x=%2250%22 y=%2268%22 font-size=%2255%22 font-weight=%22bold%22 text-anchor=%22middle%22 fill=%22%23fff%22>2048</text></svg>">
<style>
  :root{
    --bg:#f5f0e8; --board:#bbada0; --cell:#cdc1b4;
    --text:#776e65; --text-light:#f9f6f2; --accent:#edc22e;
    --btn:#8f7a66; --btn-hover:#9f8b77; --overlay:rgba(238,228,218,.73);
  }
  [data-theme="dark"]{
    --bg:#1a1a1a; --board:#2c2c2c; --cell:#3a3a3a;
    --text:#e0e0e0; --text-light:#f5f5f5; --accent:#edc22e;
    --btn:#444; --btn-hover:#555; --overlay:rgba(20,20,20,.8);
  }
  [data-theme="neutral"]{
    --bg:#e8e8e8; --board:#9e9e9e; --cell:#bdbdbd;
    --text:#424242; --text-light:#fafafa; --accent:#ffa726;
    --btn:#757575; --btn-hover:#616161; --overlay:rgba(180,180,180,.7);
  }
  [data-theme="ocean"]{
    --bg:#0d1b2a; --board:#1b263b; --cell:#415a77;
    --text:#e0e1dd; --text-light:#f8f9fa; --accent:#778da9;
    --btn:#415a77; --btn-hover:#556d8a; --overlay:rgba(13,27,42,.8);
  }
  [data-theme="sepia"]{
    --bg:#f4ecd8; --board:#a8876a; --cell:#d4b896;
    --text:#5b4636; --text-light:#fdf6e3; --accent:#d4a373;
    --btn:#8b6f47; --btn-hover:#a0825a; --overlay:rgba(244,236,216,.75);
  }
  [data-theme="forest"]{
    --bg:#1b2e1f; --board:#2d4a33; --cell:#3d6044;
    --text:#d4e8d0; --text-light:#f0f7ee; --accent:#8bc34a;
    --btn:#3d6044; --btn-hover:#4d7555; --overlay:rgba(27,46,31,.8);
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text);
    display:flex; flex-direction:column; align-items:center;
    padding:12px; min-height:100vh; transition:background .3s;
    user-select:none;
    position:fixed;
    width:100%;
    top:0; left:0;
  }

  #splash{
    position:fixed; inset:0; z-index:1000;
    background:var(--bg);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    transition:opacity .8s ease;
  }
  #splash.hide{opacity:0; pointer-events:none}
  .splash-content{
    text-align:center;
    width:100%;
    max-width:400px;
    padding:20px;
  }
  .splash-logo{
    font-size:6rem;
    font-weight:900;
    color:var(--accent);
    letter-spacing:-3px;
    opacity:0;
    animation:logoIn 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    text-shadow:0 4px 20px rgba(237,194,46,0.4);
  }
  @keyframes logoIn{
    0%{opacity:0; transform:scale(0.3) rotate(-10deg)}
    60%{opacity:1; transform:scale(1.1) rotate(3deg)}
    100%{opacity:1; transform:scale(1) rotate(0)}
  }
  .splash-divider{
    width:60%;
    height:2px;
    background:linear-gradient(90deg, transparent, var(--accent), transparent);
    margin:20px auto;
    opacity:0;
    animation:fadeIn 0.6s ease 0.8s forwards;
  }
  .splash-dev{
    font-size:1.1rem;
    font-weight:600;
    color:var(--text);
    opacity:0;
    animation:fadeIn 0.8s ease 1.2s forwards;
    letter-spacing:1px;
  }
  .splash-year{
    font-size:1.5rem;
    font-weight:800;
    color:var(--accent);
    margin-top:8px;
    opacity:0;
    animation:fadeIn 0.8s ease 1.6s forwards;
  }
  .splash-version{
    font-size:0.9rem;
    color:var(--text);
    opacity:0;
    margin-top:12px;
    animation:fadeIn 0.8s ease 2s forwards;
    background:var(--cell);
    padding:6px 16px;
    border-radius:20px;
    display:inline-block;
  }
  .splash-wrapper{
    opacity:0;
    animation:fadeIn 0.8s ease 2s forwards;
  }
  @keyframes fadeIn{
    from{opacity:0; transform:translateY(10px)}
    to{opacity:1; transform:translateY(0)}
  }
  .progress-wrap{
    margin-top:30px;
    width:80%;
    height:4px;
    background:var(--cell);
    border-radius:2px;
    overflow:hidden;
    opacity:0;
    animation:fadeIn 0.6s ease 2.4s forwards;
  }
  .progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--accent), #f59563);
    border-radius:2px;
    transition:width 0.1s linear;
  }
  .splash-hint{
    margin-top:16px;
    font-size:0.85rem;
    opacity:0;
    color:var(--text);
    animation:fadeIn 0.6s ease 2.6s forwards, pulse 2s ease-in-out 3s infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:0.5}
    50%{opacity:1}
  }
  .splash-particles{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
  }
  .particle{
    position:absolute;
    width:8px; height:8px;
    background:var(--accent);
    border-radius:50%;
    opacity:0;
    animation:float 3s ease-in-out infinite;
  }
  @keyframes float{
    0%{opacity:0; transform:translateY(100vh) scale(0)}
    50%{opacity:0.6}
    100%{opacity:0; transform:translateY(-20vh) scale(1)}
  }

  header{
    width:100%; max-width:480px;
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:12px; flex-wrap:wrap; gap:8px;
    flex-shrink:0;
  }
  h1{font-size:2.2rem; color:var(--accent); font-weight:800; letter-spacing:-1px}
  .scores{display:flex; gap:8px}
  .score-box{
    background:var(--board); color:var(--text-light);
    padding:8px 14px; border-radius:6px; text-align:center; min-width:70px;
  }
  .score-box .label{font-size:.7rem; text-transform:uppercase; opacity:.7}
  .score-box .value{font-size:1.3rem; font-weight:700}

  .controls{
    width:100%; max-width:480px;
    display:flex; gap:6px; flex-wrap:wrap;
    margin-bottom:12px;
    flex-shrink:0;
  }
  button{
    background:var(--btn); color:var(--text-light);
    border:none; padding:10px 14px; border-radius:6px;
    font-size:.9rem; font-weight:600; cursor:pointer;
    transition:background .2s, transform .1s;
    flex:1; min-width:80px;
  }
  button:hover{background:var(--btn-hover)}
  button:active{transform:scale(.96)}
  button:disabled{opacity:.4; cursor:not-allowed}

  .board-wrap{
    position:relative;
    width:100%; max-width:480px;
    flex:1;
    max-height:calc(100vh - 220px);
    aspect-ratio:1/1;
    touch-action:none;
    -webkit-touch-callout:none;
  }
  .board{
    position:absolute;
    inset:0;
    background:var(--board);
    border-radius:8px;
    display:grid;
    transition:background .3s;
  }
  .cell{
    background:var(--cell);
    border-radius:4px;
  }
  
  /* ИСПРАВЛЕНИЕ: tiles теперь внутри board с одинаковым padding */
  .tiles{
    position:absolute;
    inset:0;
    display:grid;
    pointer-events:none;
  }
  .tile{
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    border-radius:4px;
    transition:transform .2s cubic-bezier(0.4,0,0.2,1);
    background:#eee4da;
    color:var(--text);
    width:100%;
    height:100%;
  }
  .tile.new{animation:pop .25s cubic-bezier(0.4,0,0.2,1)}
  .tile.merged{animation:merge .25s cubic-bezier(0.4,0,0.2,1); z-index:2}
  @keyframes pop{0%{transform:scale(0); opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1); opacity:1}}
  @keyframes merge{0%{transform:scale(1)} 40%{transform:scale(1.2)} 100%{transform:scale(1)}}

  .t2{background:#eee4da;color:#776e65}
  .t4{background:#ede0c8;color:#776e65}
  .t8{background:#f2b179;color:#f9f6f2}
  .t16{background:#f59563;color:#f9f6f2}
  .t32{background:#f67c5f;color:#f9f6f2}
  .t64{background:#f65e3b;color:#f9f6f2}
  .t128{background:#edcf72;color:#f9f6f2}
  .t256{background:#edcc61;color:#f9f6f2}
  .t512{background:#edc850;color:#f9f6f2}
  .t1024{background:#edc53f;color:#f9f6f2}
  .t2048{background:#edc22e;color:#f9f6f2}
  .t4096{background:#3c3a32;color:#f9f6f2}
  .t8192{background:#2c2a22;color:#f9f6f2}
  .tsuper{background:#000;color:#fff}

  .overlay{
    position:absolute;
    inset:0;
    background:var(--overlay);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    border-radius:8px;
    z-index:10;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s;
  }
  .overlay.show{opacity:1; pointer-events:auto}
  .overlay h2{font-size:2rem; margin-bottom:16px; color:var(--text)}
  .overlay button{flex:0 0 auto; width:auto; padding:12px 24px}

  .modal-bg{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:16px;
  }
  .modal-bg.show{display:flex}
  .modal{
    background:var(--bg);
    color:var(--text);
    border-radius:10px;
    padding:20px;
    width:100%;
    max-width:420px;
    max-height:90vh;
    overflow-y:auto;
    box-shadow:0 10px 40px rgba(0,0,0,.3);
  }
  .modal h3{margin-bottom:14px; font-size:1.4rem}
  .modal label{display:block; margin:10px 0 4px; font-size:.9rem; font-weight:600}
  .modal input, .modal select{
    width:100%;
    padding:10px;
    border-radius:6px;
    border:1px solid var(--cell);
    background:var(--cell);
    color:var(--text);
    font-size:1rem;
  }
  .modal .row{display:flex; gap:8px; margin-top:16px}
  .modal .row button{flex:1}
  .close-x{
    float:right;
    background:none;
    color:var(--text);
    font-size:1.5rem;
    padding:0 8px;
    flex:0 0 auto;
    min-width:0;
  }
  .close-x:hover{background:none}

  .theme-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px}
  .theme-btn{
    padding:14px 8px;
    border-radius:6px;
    border:2px solid transparent;
    cursor:pointer;
    font-weight:600;
    font-size:.85rem;
  }
  .theme-btn.active{border-color:var(--accent)}
  .theme-btn[data-t="light"]{background:#f5f0e8; color:#776e65}
  .theme-btn[data-t="dark"]{background:#1a1a1a; color:#e0e0e0}
  .theme-btn[data-t="neutral"]{background:#e8e8e8; color:#424242}
  .theme-btn[data-t="ocean"]{background:#0d1b2a; color:#e0e1dd}
  .theme-btn[data-t="sepia"]{background:#f4ecd8; color:#5b4636}
  .theme-btn[data-t="forest"]{background:#1b2e1f; color:#d4e8d0}

  .volume-control{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:10px;
    padding:10px;
    background:var(--cell);
    border-radius:6px;
  }
  .volume-control input[type="range"]{
    flex:1;
    height:6px;
    border-radius:3px;
    background:var(--board);
    outline:none;
    -webkit-appearance:none;
  }
  .volume-control input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:18px;
    height:18px;
    border-radius:50%;
    background:var(--accent);
    cursor:pointer;
  }
  .volume-control input[type="range"]::-moz-range-thumb{
    width:18px;
    height:18px;
    border-radius:50%;
    background:var(--accent);
    cursor:pointer;
    border:none;
  }
  .volume-icon{font-size:1.3rem; min-width:30px}

  .leaderboard{margin-top:10px}
  .lb-row{
    display:flex;
    justify-content:space-between;
    padding:10px 12px;
    background:var(--cell);
    border-radius:6px;
    margin-bottom:6px;
    align-items:center;
  }
  .lb-row .rank{font-weight:700; color:var(--accent); min-width:30px}
  .lb-row .name{flex:1; margin-left:8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .lb-row .sc{font-weight:700; margin-left:8px}
  .lb-row .mode{font-size:.75rem; opacity:.7; margin-left:8px}
  .lb-empty{text-align:center; padding:20px; opacity:.6}
  .lb-actions{display:flex; gap:8px; margin-top:12px}
  .lb-actions button{font-size:.85rem; padding:8px 12px}

  footer{
    margin-top:12px;
    font-size:.75rem;
    opacity:.6;
    text-align:center;
    flex-shrink:0;
  }

  @media (max-width:480px){
    body{padding:8px}
    h1{font-size:1.8rem}
    .score-box{padding:6px 10px; min-width:60px}
    .score-box .value{font-size:1.1rem}
    button{padding:9px 10px; font-size:.85rem}
    .splash-logo{font-size:4.5rem}
    .board-wrap{max-height:calc(100vh - 200px)}
  }

  @media (max-height:600px){
    .board-wrap{max-height:calc(100vh - 180px)}
  }
</style>
</head>
<body>

<div id="splash">
  <div class="splash-particles" id="particles"></div>
  <div class="splash-content">
    <div class="splash-logo">2048</div>
    <div class="splash-divider"></div>
    <div class="splash-wrapper">
      <div class="splash-dev">Разработчик</div>
      <div class="splash-year">SKLN 2026</div>
      <div class="splash-version">версия 1.0</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="splash-hint">Загрузка игры...</div>
  </div>
</div>

<header>
  <h1>2048</h1>
  <div class="scores">
    <div class="score-box"><div class="label">Счёт</div><div class="value" id="score">0</div></div>
    <div class="score-box"><div class="label">Лучший</div><div class="value" id="best">0</div></div>
  </div>
</header>

<div class="controls">
  <button id="btnNew">Новая</button>
  <button id="btnUndo">↶ Ход назад</button>
  <button id="btnSettings">⚙ Настройки</button>
  <button id="btnLeader">🏆 Рейтинг</button>
</div>

<div class="board-wrap" id="boardWrap">
  <div class="board" id="board">
    <div class="tiles" id="tiles"></div>
  </div>
  <div class="overlay" id="overlay">
    <h2 id="overlayText">Игра окончена!</h2>
    <button id="overlayBtn">Новая игра</button>
  </div>
</div>

<footer>Игрок: <span id="playerName">гость</span> · Режим: <span id="modeLabel">4×4</span></footer>

<div class="modal-bg" id="settingsModal">
  <div class="modal">
    <button class="close-x" data-close="settingsModal">×</button>
    <h3>Настройки</h3>
    <label>Ваш логин</label>
    <input type="text" id="loginInput" maxlength="20" placeholder="Введите логин">
    <label>Размер поля</label>
    <select id="sizeSelect">
      <option value="3">3 × 3 (цель: 512)</option>
      <option value="4" selected>4 × 4 (цель: 2048)</option>
      <option value="5">5 × 5 (цель: 4096)</option>
      <option value="6">6 × 6 (цель: 8192)</option>
    </select>
    <label>Тема оформления</label>
    <div class="theme-grid" id="themeGrid">
      <div class="theme-btn" data-t="light">Светлая</div>
      <div class="theme-btn" data-t="dark">Тёмная</div>
      <div class="theme-btn" data-t="neutral">Нейтральная</div>
      <div class="theme-btn" data-t="ocean">Океан</div>
      <div class="theme-btn" data-t="sepia">Сепия</div>
      <div class="theme-btn" data-t="forest">Лес</div>
    </div>
    <label>Звук</label>
    <div class="volume-control">
      <span class="volume-icon" id="volumeIcon">🔊</span>
      <input type="range" id="volumeSlider" min="0" max="100" value="50">
      <span id="volumeValue">50%</span>
    </div>
    <div class="row"><button id="saveSettings">Сохранить</button></div>
  </div>
</div>

<div class="modal-bg" id="leaderModal">
  <div class="modal">
    <button class="close-x" data-close="leaderModal">×</button>
    <h3>🏆 Таблица лидеров</h3>
    <div class="leaderboard" id="leaderboard"></div>
    <div class="lb-actions">
      <button id="exportLeader">📤 Экспорт</button>
      <button id="importLeader">📥 Импорт</button>
      <button id="clearLeader">🗑 Очистить</button>
    </div>
    <input type="file" id="importFile" accept=".json" style="display:none">
  </div>
</div>

<script>
(() => {
  const LS_KEY = 'game2048_v1';
  const LS_SETTINGS = 'game2048_settings_v1';
  const LS_LEADER = 'game2048_leader_v1';
  const TARGETS = {3:512, 4:2048, 5:4096, 6:8192};

  let state = {grid:[], size:4, score:0, best:0, history:[], won:false, over:false};
  let settings = {theme:'light', size:4, login:'', volume:50, soundEnabled:true};

  // ===== Звук =====
  let audioCtx = null;
  function initAudio(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ console.warn('Audio not supported'); }
    }
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playTone(freq, duration, type='sine'){
    if(!settings.soundEnabled || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    const vol = settings.volume / 100;
    gain.gain.setValueAtTime(vol * 0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + duration);
  }
  function playMoveSound(){ playTone(220, 0.08, 'sine'); }
  function playMergeSound(value){
    const baseFreq = 300 + Math.log2(value) * 50;
    playTone(baseFreq, 0.15, 'triangle');
    setTimeout(()=>playTone(baseFreq*1.5, 0.1, 'sine'), 50);
  }
  function playWinSound(){
    [523,659,784,1047].forEach((f,i)=>setTimeout(()=>playTone(f,0.2,'sine'), i*100));
  }
  function playLoseSound(){
    [400,350,300,250].forEach((f,i)=>setTimeout(()=>playTone(f,0.2,'sawtooth'), i*150));
  }
  function playClickSound(){ playTone(800, 0.05, 'square'); }

  // ===== Хранение =====
  function loadSettings(){ try{ const s=JSON.parse(localStorage.getItem(LS_SETTINGS)); if(s) settings={...settings,...s}; }catch(e){} }
  function saveSettings(){ localStorage.setItem(LS_SETTINGS, JSON.stringify(settings)); }
  function loadGame(){ try{ const s=JSON.parse(localStorage.getItem(LS_KEY)); if(s && s.grid && s.grid.length){ state={...state,...s}; state.history=s.history||[]; } }catch(e){} }
  function saveGame(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  function loadLeader(){ try{return JSON.parse(localStorage.getItem(LS_LEADER))||[]}catch(e){return[]} }
  function saveLeader(list){ localStorage.setItem(LS_LEADER, JSON.stringify(list)); }

  // ===== Логика =====
  function emptyGrid(n){ return Array.from({length:n},()=>Array(n).fill(0)); }
  function clone(g){ return g.map(r=>r.slice()); }
  function emptyCells(){
    const cells=[];
    for(let r=0;r<state.size;r++)
      for(let c=0;c<state.size;c++)
        if(!state.grid[r][c]) cells.push([r,c]);
    return cells;
  }
  function spawnTile(){
    const cells=emptyCells();
    if(!cells.length) return null;
    const [r,c]=cells[Math.floor(Math.random()*cells.length)];
    state.grid[r][c] = Math.random()<0.9 ? 2 : 4;
    return [r,c];
  }

  function slideRow(row){
    const arr = row.filter(v=>v);
    let gained = 0;
    const merged = [];
    const mergedPositions = [];
    for(let i=0;i<arr.length;i++){
      if(i<arr.length-1 && arr[i]===arr[i+1]){
        const v = arr[i]*2;
        merged.push(v);
        mergedPositions.push(merged.length-1);
        gained += v;
        i++;
      } else merged.push(arr[i]);
    }
    while(merged.length<state.size) merged.push(0);
    return {row:merged, gained, mergedPositions};
  }

  function move(dir){
    if(state.over) return false;
    const before = clone(state.grid);
    let gained = 0;
    let mergedValues = [];
    const n = state.size;

    if(dir==='left'){
      for(let r=0;r<n;r++){
        const res = slideRow(state.grid[r]);
        state.grid[r] = res.row; gained += res.gained;
        mergedValues.push(...res.mergedPositions.map(p=>({r,c:p,v:res.row[p]})));
      }
    } else if(dir==='right'){
      for(let r=0;r<n;r++){
        const res = slideRow(state.grid[r].slice().reverse());
        const row = res.row.reverse();
        state.grid[r] = row; gained += res.gained;
        mergedValues.push(...res.mergedPositions.map(p=>({r,c:n-1-p,v:row[p]})));
      }
    } else if(dir==='up'){
      for(let c=0;c<n;c++){
        const col = state.grid.map(r=>r[c]);
        const res = slideRow(col);
        for(let r=0;r<n;r++) state.grid[r][c] = res.row[r];
        gained += res.gained;
        mergedValues.push(...res.mergedPositions.map(p=>({r:p,c,v:res.row[p]})));
      }
    } else if(dir==='down'){
      for(let c=0;c<n;c++){
        const col = state.grid.map(r=>r[c]).reverse();
        const res = slideRow(col);
        const row = res.row.reverse();
        for(let r=0;r<n;r++) state.grid[r][c] = row[r];
        gained += res.gained;
        mergedValues.push(...res.mergedPositions.map(p=>({r:n-1-p,c,v:row[p]})));
      }
    }

    const changed = JSON.stringify(before)!==JSON.stringify(state.grid);
    if(!changed) return false;

    state.history.push({grid:before, score:state.score});
    if(state.history.length>20) state.history.shift();

    state.score += gained;
    if(state.score>state.best) state.best = state.score;
    spawnTile();

    playMoveSound();
    if(mergedValues.length>0){
      setTimeout(()=>{ mergedValues.forEach(m=>playMergeSound(m.v)); }, 100);
    }

    const target = TARGETS[state.size];
    if(!state.won){
      for(let r=0;r<n;r++)
        for(let c=0;c<n;c++)
          if(state.grid[r][c]>=target){
            state.won=true;
            playWinSound();
            showOverlay('Победа! 🎉','Продолжить');
            return true;
          }
    }
    if(isGameOver()){
      state.over=true;
      playLoseSound();
      showOverlay('Игра окончена','Новая игра');
      saveScore();
    }
    return true;
  }

  function isGameOver(){
    const n = state.size;
    for(let r=0;r<n;r++)
      for(let c=0;c<n;c++){
        if(!state.grid[r][c]) return false;
        if(c<n-1 && state.grid[r][c]===state.grid[r][c+1]) return false;
        if(r<n-1 && state.grid[r][c]===state.grid[r+1][c]) return false;
      }
    return true;
  }

  function undo(){
    if(!state.history.length) return;
    playClickSound();
    const prev = state.history.pop();
    state.grid = prev.grid;
    state.score = prev.score;
    state.over = false;
    hideOverlay();
    render();
    saveGame();
  }

  function newGame(){
    playClickSound();
    state = {
      grid: emptyGrid(settings.size),
      size: settings.size,
      score: 0, best: state.best,
      history: [], won: false, over: false
    };
    spawnTile(); spawnTile();
    hideOverlay();
    render();
    saveGame();
  }

  // ===== Рендер (ИСПРАВЛЕННЫЙ) =====
  const boardEl = document.getElementById('board');
  const tilesEl = document.getElementById('tiles');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const modeEl = document.getElementById('modeLabel');
  const playerEl = document.getElementById('playerName');

  function render(){
    const n = state.size;
    const isMobile = window.innerWidth <= 480;
    const gap = isMobile ? 6 : 8;
    const padding = isMobile ? 6 : 8;

    // Настраиваем board
    const gridTemplate = `repeat(${n}, 1fr)`;
    boardEl.style.gridTemplateColumns = gridTemplate;
    boardEl.style.gridTemplateRows = gridTemplate;
    boardEl.style.padding = padding + 'px';
    boardEl.style.gap = gap + 'px';

    // Настраиваем tiles (те же параметры!)
    tilesEl.style.gridTemplateColumns = gridTemplate;
    tilesEl.style.gridTemplateRows = gridTemplate;
    tilesEl.style.padding = padding + 'px';
    tilesEl.style.gap = gap + 'px';

    // Очищаем board (кроме tiles)
    const cells = boardEl.querySelectorAll('.cell');
    cells.forEach(c => c.remove());
    
    // Создаём ячейки
    for(let i=0;i<n*n;i++){
      const d = document.createElement('div');
      d.className = 'cell';
      boardEl.insertBefore(d, tilesEl);
    }

    // Очищаем плитки
    tilesEl.innerHTML = '';

    // Создаём плитки
    for(let r=0;r<n;r++){
      for(let c=0;c<n;c++){
        const v = state.grid[r][c];
        if(!v) continue;
        
        const t = document.createElement('div');
        t.className = 'tile' + tileClass(v);
        t.textContent = v;
        
        const rowStart = r + 1;
        const colStart = c + 1;
        t.style.gridRow = `${rowStart} / ${rowStart + 1}`;
        t.style.gridColumn = `${colStart} / ${colStart + 1}`;
        
        const fontSize = isMobile ? 24 : 32;
        t.style.fontSize = fontSize + 'px';
        
        tilesEl.appendChild(t);
      }
    }

    scoreEl.textContent = state.score;
    bestEl.textContent = state.best;
    modeEl.textContent = `${n}×${n}`;
    playerEl.textContent = settings.login || 'гость';
  }

  function tileClass(v){
    if(v<=8192) return ' t'+v;
    return ' tsuper';
  }

  // ===== Overlay =====
  const overlayEl = document.getElementById('overlay');
  const overlayText = document.getElementById('overlayText');
  const overlayBtn = document.getElementById('overlayBtn');
  function showOverlay(text, btn){
    overlayText.textContent = text;
    overlayBtn.textContent = btn;
    overlayEl.classList.add('show');
  }
  function hideOverlay(){ overlayEl.classList.remove('show'); }
  overlayBtn.onclick = () => {
    playClickSound();
    if(state.won && !state.over){ hideOverlay(); return; }
    newGame();
  };

  // ===== Рейтинг =====
  function saveScore(){
    const list = loadLeader();
    list.push({name:settings.login||'гость', score:state.score, size:state.size, date:Date.now()});
    list.sort((a,b)=>b.score-a.score);
    saveLeader(list.slice(0,50));
  }
  function renderLeader(){
    const list = loadLeader();
    const el = document.getElementById('leaderboard');
    if(!list.length){ el.innerHTML='<div class="lb-empty">Пока нет результатов</div>'; return; }
    el.innerHTML = list.map((x,i)=>`
      <div class="lb-row">
        <span class="rank">${i+1}</span>
        <span class="name">${escapeHtml(x.name)}</span>
        <span class="mode">${x.size}×${x.size}</span>
        <span class="sc">${x.score}</span>
      </div>
    `).join('');
  }
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

  function exportLeaderboard(){
    playClickSound();
    const list = loadLeader();
    const data = JSON.stringify(list, null, 2);
    const blob = new Blob([data], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `2048-leaderboard-${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }
  function importLeaderboard(){
    playClickSound();
    document.getElementById('importFile').click();
  }
  function handleImport(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const data = JSON.parse(ev.target.result);
        if(!Array.isArray(data)) throw new Error('Invalid format');
        const current = loadLeader();
        const merged = [...current, ...data];
        merged.sort((a,b)=>b.score-a.score);
        saveLeader(merged.slice(0,50));
        renderLeader();
        alert(`Импортировано ${data.length} записей`);
      }catch(err){ alert('Ошибка импорта: неверный формат файла'); }
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  // ===== Управление =====
  document.addEventListener('keydown', e=>{
    const map = {ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',
                 a:'left',d:'right',w:'up',s:'down'};
    const dir = map[e.key];
    if(dir){ e.preventDefault(); initAudio(); if(move(dir)){ render(); saveGame(); } }
    if(e.key==='z' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); undo(); }
  });

  // ===== Свайпы =====
  const boardWrap = document.getElementById('boardWrap');
  let tx=0, ty=0, touchStartTime=0;

  boardWrap.addEventListener('touchstart', (e)=>{
    tx = e.touches[0].clientX;
    ty = e.touches[0].clientY;
    touchStartTime = Date.now();
    initAudio();
  }, {passive:true});

  boardWrap.addEventListener('touchmove', (e)=>{
    e.preventDefault();
  }, {passive:false});

  boardWrap.addEventListener('touchend', (e)=>{
    const dx = e.changedTouches[0].clientX - tx;
    const dy = e.changedTouches[0].clientY - ty;
    const dt = Date.now() - touchStartTime;
    if(Math.abs(dx)<30 && Math.abs(dy)<30) return;
    if(dt > 1000) return;
    const dir = Math.abs(dx)>Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'down':'up');
    if(move(dir)){ render(); saveGame(); }
  }, {passive:true});

  document.addEventListener('touchmove', (e)=>{
    if(e.target.closest('.board-wrap')){
      e.preventDefault();
    }
  }, {passive:false});

  // Кнопки
  document.getElementById('btnNew').onclick = ()=>{
    initAudio();
    if(state.score>0 && !confirm('Начать новую игру?')) return;
    newGame();
  };
  document.getElementById('btnUndo').onclick = undo;
  document.getElementById('btnSettings').onclick = ()=>{
    initAudio(); playClickSound();
    document.getElementById('loginInput').value = settings.login;
    document.getElementById('sizeSelect').value = settings.size;
    document.getElementById('volumeSlider').value = settings.volume;
    document.getElementById('volumeValue').textContent = settings.volume + '%';
    updateVolumeIcon(settings.volume);
    document.querySelectorAll('.theme-btn').forEach(b=>{
      b.classList.toggle('active', b.dataset.t===settings.theme);
    });
    document.getElementById('settingsModal').classList.add('show');
  };
  document.getElementById('btnLeader').onclick = ()=>{
    initAudio(); playClickSound();
    renderLeader();
    document.getElementById('leaderModal').classList.add('show');
  };
  document.getElementById('saveSettings').onclick = ()=>{
    playClickSound();
    const newLogin = document.getElementById('loginInput').value.trim();
    const newSize = +document.getElementById('sizeSelect').value;
    const newVolume = +document.getElementById('volumeSlider').value;
    const themeChanged = settings.theme !== currentSelectedTheme();
    settings.login = newLogin;
    settings.size = newSize;
    settings.volume = newVolume;
    settings.soundEnabled = newVolume > 0;
    if(themeChanged) applyTheme(currentSelectedTheme());
    saveSettings();
    if(newSize !== state.size) newGame();
    else { render(); saveGame(); }
    closeModal('settingsModal');
  };
  document.getElementById('exportLeader').onclick = exportLeaderboard;
  document.getElementById('importLeader').onclick = importLeaderboard;
  document.getElementById('importFile').onchange = handleImport;
  document.getElementById('clearLeader').onclick = ()=>{
    playClickSound();
    if(confirm('Очистить весь рейтинг?')){ saveLeader([]); renderLeader(); }
  };

  const volumeSlider = document.getElementById('volumeSlider');
  const volumeValue = document.getElementById('volumeValue');
  const volumeIcon = document.getElementById('volumeIcon');
  volumeSlider.oninput = (e)=>{
    const val = +e.target.value;
    volumeValue.textContent = val + '%';
    updateVolumeIcon(val);
    settings.volume = val;
    settings.soundEnabled = val > 0;
    if(val > 0) playClickSound();
  };
  function updateVolumeIcon(val){
    if(val===0) volumeIcon.textContent='🔇';
    else if(val<33) volumeIcon.textContent='🔈';
    else if(val<66) volumeIcon.textContent='🔉';
    else volumeIcon.textContent='🔊';
  }

  function currentSelectedTheme(){
    const el = document.querySelector('.theme-btn.active');
    return el ? el.dataset.t : settings.theme;
  }
  document.querySelectorAll('.theme-btn').forEach(b=>{
    b.onclick = ()=>{
      playClickSound();
      document.querySelectorAll('.theme-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
    };
  });

  document.querySelectorAll('[data-close]').forEach(b=>{
    b.onclick = ()=>{ playClickSound(); closeModal(b.dataset.close); };
  });
  document.querySelectorAll('.modal-bg').forEach(m=>{
    m.onclick = e=>{ if(e.target===m){ playClickSound(); m.classList.remove('show'); } };
  });
  function closeModal(id){ document.getElementById(id).classList.remove('show'); }

  function applyTheme(t){
    settings.theme = t;
    if(t==='light') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
  }

  window.addEventListener('beforeunload', saveGame);
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='hidden') saveGame();
  });

  // ===== SPLASH =====
  function createParticles(){
    const container = document.getElementById('particles');
    for(let i=0;i<15;i++){
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random()*100 + '%';
      p.style.animationDelay = (Math.random()*3) + 's';
      p.style.animationDuration = (2 + Math.random()*2) + 's';
      p.style.width = p.style.height = (4 + Math.random()*8) + 'px';
      container.appendChild(p);
    }
  }

  function runSplash(){
    createParticles();
    const bar = document.getElementById('progressBar');
    const duration = 10000;
    const startTime = Date.now();

    const interval = setInterval(()=>{
      const elapsed = Date.now() - startTime;
      const progress = Math.min(100, (elapsed / duration) * 100);
      bar.style.width = progress + '%';

      if(elapsed >= duration){
        clearInterval(interval);
        const splash = document.getElementById('splash');
        splash.classList.add('hide');
        setTimeout(()=>{
          splash.style.display = 'none';
        }, 800);
      }
    }, 50);
  }

  // ===== Инициализация =====
  loadSettings();
  applyTheme(settings.theme);
  loadGame();
  if(!state.grid.length || state.grid.length !== settings.size){
    state.size = settings.size;
    newGame();
  } else {
    setTimeout(()=>{ render(); }, 100);
  }

  runSplash();

  let resizeTimer;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(()=>{
      requestAnimationFrame(render);
    }, 150);
  });

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(err=>{ console.log('SW failed:', err); });
  }
})();
</script>
</body>
</html>
